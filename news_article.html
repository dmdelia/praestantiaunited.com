<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editorial — PRAESTANTIA UNITED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css_style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">PRAESTANTIA <span>UNITED</span></a>
    <nav><a href="index.html">NEWS</a><a href="news_article.html">EDITORIAL</a><a href="admin_news-create.html">ADMIN</a></nav>
  </header>
  <main>
    <article id="article" class="article"></article>
  </main>
  <footer class="site-footer"><span>PRAESTANTIA UNITED</span><span>FIDELITAS &amp; TACTICAL DISCIPLINE</span></footer>
  <script src="data_news.js"></script>
  <script>
    const slug = new URLSearchParams(location.search).get("slug") || NEWS[0].slug;
    const item = NEWS.find(n => n.slug === slug) || NEWS[0];
    document.title = `${item.title} — PRAESTANTIA UNITED`;
    document.getElementById("article").innerHTML = `
      <div class="eyebrow">${item.category}</div>
      <div class="meta">${item.date}</div>
      <h1>${item.title}</h1>
      <div class="lead">${item.subheadline}</div>
      <div class="article-body">${markdown(item.content)}</div>`;
  </script>
  <script src="js_app.js"></script>
</body>
</html>
