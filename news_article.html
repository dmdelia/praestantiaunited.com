<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redirecting — PRAESTANTIA UNITED</title></head>
<body>
<script>
  const slug = new URLSearchParams(location.search).get("slug");
  location.replace(slug ? "/news/" + encodeURIComponent(slug) : "/");
</script>
</body>
</html>
