<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Routing — PRAESTANTIA UNITED</title>
  <meta name="robots" content="noindex">
</head>
<body>
<script>
  (function () {
    var path = location.pathname;
    var validReleased = /^\/news\/[^/]+\/?$/.test(path);
    var validPreview = /^\/news\/preview\/[^/]+\/?$/.test(path);

    if (validReleased || validPreview) {
      sessionStorage.setItem("praestantia_news_route", path + location.search + location.hash);
      location.replace("/news_article.html");
      return;
    }

    document.body.innerHTML = "<h1>404</h1><p>Resource not found.</p>";
  })();
</script>
</body>
</html>
