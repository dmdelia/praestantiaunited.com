<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Routing — PRAESTANTIA UNITED</title>
  <meta name="robots" content="noindex">
</head>
<body>
<script>
(function () {
  var path = location.pathname.replace(/\/+$/, "");
  var previewMatch = path.match(/^\/news\/preview\/([^/]+)$/);
  var publicMatch = path.match(/^\/news\/([^/]+)$/);

  if (previewMatch) {
    location.replace("/news_article.html?preview=" + encodeURIComponent(decodeURIComponent(previewMatch[1])));
    return;
  }

  if (publicMatch) {
    location.replace("/news_article.html?slug=" + encodeURIComponent(decodeURIComponent(publicMatch[1])));
    return;
  }

  document.body.innerHTML = "<h1>404</h1><p>Resource not found.</p>";
})();
</script>
</body>
</html>
