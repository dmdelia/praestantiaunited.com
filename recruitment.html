<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recruitment — PRAESTANTIA UNITED</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css_style.css">
</head>
<body data-page="recruitment">
<header class="site-header"><a class="brand" href="index.html">PRAESTANTIA <span>UNITED</span></a><button class="nav-toggle" aria-label="Toggle navigation">MENU</button><nav class="site-nav"><a href="index.html">NEWSROOM</a><a href="pantheon.html">PANTHEON</a><a href="matchday.html">MATCHDAY</a><a class="active" href="recruitment.html">RECRUITMENT</a><a href="partners.html">PARTNERS</a></nav></header>
<main>
<section class="page-hero"><p class="eyebrow">ENTRY PROTOCOL</p><h1>RECRUITMENT</h1><p>Apply to join the project or request a competitive test match.</p></section>
<section class="form-grid">
<form id="application-form" class="form-panel">
<p class="eyebrow">01 / APPLICATION</p><h2>Join Praestantia.</h2>
<label>Name<input name="name" required></label>
<label>Email<input name="email" type="email" required></label>
<label>Discord<input name="discord"></label>
<div class="two-col"><label>Age<input name="age" type="number" min="1" max="120"></label><label>Position<input name="position"></label></div>
<label>Experience<textarea name="experience" rows="4"></textarea></label>
<label>Message<textarea name="message" rows="6"></textarea></label>
<button class="action-button" type="submit">SUBMIT APPLICATION</button><p class="form-status" aria-live="polite"></p>
</form>

<form id="match-request-form" class="form-panel">
<p class="eyebrow">02 / TEST MATCH</p><h2>Request opposition.</h2>
<label>Contact name<input name="requester_name" required></label>
<label>Email<input name="requester_email" type="email" required></label>
<label>Team name<input name="team_name" required></label>
<label>Discord<input name="discord"></label>
<div class="two-col"><label>Preferred date<input name="preferred_date" type="date"></label><label>Preferred time<input name="preferred_time" type="time"></label></div>
<label>Format<input name="format" placeholder="e.g. 5v5"></label>
<label>Message<textarea name="message" rows="6"></textarea></label>
<button class="action-button" type="submit">REQUEST MATCH</button><p class="form-status" aria-live="polite"></p>
</form>
</section>
</main>
<footer class="site-footer"><span>PRAESTANTIA UNITED</span><span>FIDELITAS &amp; TACTICAL DISCIPLINE</span></footer>
<script src="js_app.js"></script>
</body>
</html>
